<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        caption{
            background-color: rgb(121, 121, 121);
            color: white;
            border-top: 1px solid black;
        }
        table{
            border-collapse: collapse;
        }
        tbody > tr:nth-child(2n){
            background-color: rgb(121, 121, 121);
        }
        th,td{
            border: 1px solid black;
            padding-left: 20px;
            padding-right: 20px;
        }
    </style>
</head>
<body>
   <table>
        <caption>
            tabela de gostos filmes
        </caption>
        <Thead>
            <tr>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">filmes</th>
            </tr>
        </Thead>
        <tbody>
            <tr>
                <th rowspan="3" scope="rowgroup">Homens</th>
                <td>Bruno Mendonca</td>
                <td>Intocaveis</td>
                <td>aminesia</td>
                <td>Gladiador</td>
            </tr>
            <tr>
               <td>Daniel Lorenco</td>
                <td >Wall-E</td>
               <td>Oldboy</td>
               <td>Dangal</td> 
            </tr>
            <tr>
               <td>Fabiano Mota</td>
               <td>Stars Wars</td>
               <td>Taxi Driver</td>
               <td>Toy Story</td> 
            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana Maria Santos</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Beatiz Souza</td>
                <td>Hulk</td>
                <td>Rambo</td>
                <td>Vingadores</td>
            </tr>
            <tr>
                <td>Claudia Melo</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>
            </tr>
        </tbody>
   </table> 
</body>
</html>
