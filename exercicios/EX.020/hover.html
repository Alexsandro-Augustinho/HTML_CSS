<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de hover</title>
    <style>
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
        }
    </style>
</head>
<body>
    <h1>exemplo de hover</h1>
    <p>passe o mouse sobre o texto abaixo</p>
    <div>
        passe o omouese aqui
        <p><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBRvwZS_C91icoZ0qhM36r6YgRuqA1fDoIEQ&s" alt="meme"></p>
    </div>
</body>
</html>
