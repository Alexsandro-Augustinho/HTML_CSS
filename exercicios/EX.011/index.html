<!DOCTYPE html>
<html lang="pt-br ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>medias em html</title>
</head>
<body>
    <h1>imagem dinamica</h1>
    <p>aumente e diminua o seu navegador</p>
    <picture>
        <source media="(max-width:750px )" srcset="img/fotop.png" type="image/png">
        <source media="(max-width:1000px )" srcset="img/fotom.png" type="image/png">
        <img src="img/grandeg.png" alt="imagem flexivel">
    </picture>
    <h1>reproduzindo audios</h1>
    <p>vamos aprender a reproduzir</p>
    <audio src="media/undertale-fallen down but more comforting - Anas bariza tsaqif (youtube).mp3" controls autoplay></audio>
</body>
</html>
